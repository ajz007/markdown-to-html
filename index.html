<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Markdown to HTML Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #333;
    }

    header {
      background-color: #343a40;
      color: #fff;
      padding: 1rem 2rem;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      padding: 2rem;
      gap: 1.5rem;
      max-width: 1200px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 250px;
      font-size: 1rem;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: monospace;
      resize: vertical;
    }

    button {
      padding: 0.75rem 1.5rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      align-self: flex-start;
    }

    button:hover {
      background-color: #0056b3;
    }

    .output {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1.5rem;
      background-color: white;
      min-height: 250px;
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #888;
      margin: 2rem 0 1rem 0;
    }

    @media (min-width: 768px) {
      .container {
        flex-direction: row;
      }
      .input-area, .output-area {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      button {
        margin-top: 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Markdown to HTML Converter</h1>
  </header>

  <div class="container">
    <div class="input-area">
      <h2>Markdown Input</h2>
      <textarea id="markdown" placeholder="Enter Markdown here..."># Hello Markdown 👋 
        Type some Markdown on the left and click Convert.</textarea>
      <button onclick="convert()">Convert</button>
    </div>

    <div class="output-area">
      <h2>HTML Output</h2>
      <div id="output" class="output"></div>
    </div>
  </div>

  <footer>
    © 2025 sharemybit.com – Built with ❤️ using HTML + JS
  </footer>

  <script>
    function convert() {
      const input = document.getElementById("markdown").value;
      document.getElementById("output").innerHTML = marked.parse(input);
    }

    // Auto-render on load
    window.onload = convert;
  </script>
</body>
</html>
